name: Verify inference and numerical results
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      retrain:
        description: "Refit calibration models from published measurements and scores"
        required: false
        type: boolean
        default: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify shipped model artifacts
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.retrain }}
        run: bash run_all.sh --verify
      - name: Refit models and verify the regenerated scores
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.retrain }}
        run: bash run_all.sh --train
